<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VegaFlow Universal · Main modules</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 700px; max-width: 100%; display: block; }
    @media print {
      .scroll { overflow-x: visible; }
      svg { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Modules · VegaFlow Universal</p>
    <h1>VegaFlow Universal · Main modules</h1>
    <div class="scroll">
    <svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="main-modules-title main-modules-desc">
      <title id="main-modules-title">VegaFlow Universal · Main modules</title>
      <desc id="main-modules-desc">Detection feeds the Rust core, which decides; the C++ layer then acts through four modules, every disk and process write passes SandboxGuard, and the GUI and command line sit on top.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first, then nodes -->
      <line x1="138" y1="120" x2="138" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="662" y1="120" x2="662" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="118" y1="256" x2="118" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="306" y1="256" x2="306" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="494" y1="256" x2="494" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="682" y1="256" x2="682" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="118" y1="412" x2="118" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="306" y1="412" x2="306" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="494" y1="412" x2="494" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="682" y1="412" x2="682" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels, masked with a gap to the line -->
      <rect x="146" y="134" width="190" height="20" fill="#f5f5f5"/>
      <text x="152" y="149" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">probe + game in front</text>
      <rect x="474" y="134" width="180" height="20" fill="#f5f5f5"/>
      <text x="652" y="149" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="end">commands and screens</text>

      <!-- Top row: input and interface -->
      <rect x="28" y="32" width="220" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="138" y="60" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Detection</text>
      <text x="138" y="80" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hardware probe</text>
      <text x="138" y="98" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">foreground game</text>

      <rect x="552" y="32" width="220" height="88" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="662" y="60" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">GUI and command line</text>
      <text x="662" y="80" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Win32 / GDI window</text>
      <text x="662" y="98" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">console commands</text>

      <!-- Accent: the Rust core decides -->
      <rect x="28" y="168" width="744" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
      <text x="400" y="204" fill="#2d3142" font-size="16" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Rust core decides</text>
      <text x="400" y="230" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tiers · process classes · path policy · memory purge rules</text>

      <!-- C++ row: the four modules that act -->
      <rect x="28" y="304" width="180" height="108" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="118" y="332" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Background</text>
      <text x="118" y="350" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">isolation</text>
      <text x="118" y="368" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CPU sets, EcoQoS</text>
      <text x="118" y="386" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">I/O priority</text>

      <rect x="216" y="304" width="180" height="108" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="306" y="332" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Graphics and</text>
      <text x="306" y="350" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">driver tweaks</text>
      <text x="306" y="368" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">registry backup</text>

      <rect x="404" y="304" width="180" height="108" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="494" y="332" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Engine presets</text>
      <text x="494" y="350" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DXVK-GPLAsync</text>
      <text x="494" y="368" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">only without</text>
      <text x="494" y="386" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">anti-cheat</text>

      <rect x="592" y="304" width="180" height="108" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="682" y="332" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Memory purge</text>
      <text x="682" y="350" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">from the core</text>

      <!-- Every write passes the guard -->
      <rect x="28" y="452" width="744" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="476" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">SandboxGuard</text>
      <text x="400" y="496" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every disk and process write goes through it</text>
    </svg>
    </div>
  </div>
</body>
</html>
