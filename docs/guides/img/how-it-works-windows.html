<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How it works, windows: SandboxGuard file write</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 900px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    /* Drawn at 700 px wide; the 800-unit viewBox keeps every label at 14 px or more. */
    svg { width: 100%; max-width: 700px; min-width: 0; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Diagram Design</p>
    <h1>How a SandboxGuard file write works</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-windows-title how-it-works-windows-desc">
        <title id="how-it-works-windows-title">SandboxGuard file write, step by step</title>
        <desc id="how-it-works-windows-desc">Seven steps that a file write goes through in SandboxGuard, from the caller's request to either the write or a refusal, where step 6 re-checks the real path of the opened file.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Connectors first, so the nodes sit on top of them. Each one runs straight down the centre line x=400. -->
        <line x1="400" y1="104" x2="400" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="400" y1="184" x2="400" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="400" y1="264" x2="400" y2="296" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="400" y1="344" x2="400" y2="376" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="400" y1="424" x2="400" y2="456" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="400" y1="504" x2="400" y2="536" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Step 1 -->
        <rect x="160" y="56" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="56" width="480" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="86" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1 · A caller asks for a write</text>

        <!-- Step 2 -->
        <rect x="160" y="136" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="136" width="480" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="166" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2 · Work out the real path</text>

        <!-- Step 3 -->
        <rect x="160" y="216" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="216" width="480" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3 · Rust decides: allowed or forbidden folder</text>

        <!-- Step 4 -->
        <rect x="160" y="296" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="296" width="480" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="326" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">4 · Anti-cheat scan (writes only)</text>

        <!-- Step 5 -->
        <rect x="160" y="376" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="376" width="480" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="406" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">5 · Open file, content unchanged</text>

        <!-- Step 6 (accent) -->
        <rect x="160" y="456" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="456" width="480" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="400" y="486" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">6 · Re-check real path of open file</text>

        <!-- Step 7 -->
        <rect x="160" y="536" width="480" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="536" width="480" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="566" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">7 · Write content, or refuse and log</text>
      </svg>
    </div>
  </div>
</body>
</html>
