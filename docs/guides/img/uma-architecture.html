<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMA architecture · One memory for CPU and GPU</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; max-width: 700px; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · VegaFlow Universal</p>
    <h1>UMA architecture · One memory for CPU and GPU</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uma-architecture-title uma-architecture-desc">
        <title id="uma-architecture-title">UMA architecture · One memory for CPU and GPU</title>
        <desc id="uma-architecture-desc">On the test APU, the Zen 2 CPU and the Vega 6 iGPU reach the same system RAM over one shared dual-channel DDR4 bus, so the 512 MB of dedicated VRAM reported by the BIOS is not a real limit.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, then nodes -->
        <path d="M240,184 L240,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M560,184 L560,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M400,336 L400,384" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- CPU -->
        <rect x="80" y="96" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="96" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="132" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CPU: Ryzen 5 4600H</text>
        <text x="200" y="158" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">Zen 2, 6 cores, 12 threads</text>

        <!-- iGPU -->
        <rect x="480" y="96" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="96" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="132" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iGPU: Radeon Vega 6</text>
        <text x="600" y="158" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">6 Compute Units</text>

        <!-- Shared bus (accent) -->
        <rect x="200" y="232" width="400" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="232" width="400" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="400" y="268" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared bus: dual-channel DDR4</text>
        <text x="400" y="292" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">~42 GB/s theoretical bandwidth</text>
        <text x="400" y="314" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">CPU and GPU compete for it</text>

        <!-- System RAM -->
        <rect x="200" y="384" width="400" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="384" width="400" height="88" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="420" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">System RAM: one shared pool</text>
        <text x="400" y="446" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">No separate VRAM for CPU or GPU</text>

        <!-- BIOS note (not a data path) -->
        <rect x="80" y="504" width="640" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="504" width="640" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="400" y="534" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BIOS reports 512 MB of dedicated VRAM</text>
        <text x="400" y="558" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">Not a real limit: the GPU can use up to 8192 MB</text>
      </svg>
    </div>
  </div>
</body>
</html>
