<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the optimize levers work, step by step</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    /* The 800-unit viewBox is shown at 700 px on the page. */
    svg { width: 700px; min-width: 700px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Guide · Diagram</p>
    <h1>How the optimize levers work, step by step</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-optimize-title how-it-works-optimize-desc">
        <title id="how-it-works-optimize-title">How the optimize levers work, step by step</title>
        <desc id="how-it-works-optimize-desc">Eight steps from the session cycle to the restore on exit, where the confine and purge decisions are made in Rust and the changes are applied by C++.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, so the nodes sit on top of their ends -->
        <line x1="360" y1="80" x2="360" y2="104" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="160" x2="360" y2="184" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="240" x2="360" y2="264" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="320" x2="360" y2="344" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="400" x2="360" y2="424" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="480" x2="360" y2="504" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="360" y1="560" x2="360" y2="584" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- 1 -->
        <rect x="120" y="24" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="24" width="480" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <circle cx="144" cy="52" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="57" fill="#2d3142" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <text x="176" y="48" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Session cycle calls the optimizer</text>
        <text x="176" y="68" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Passes game and background process lists</text>

        <!-- 2 -->
        <rect x="120" y="104" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="104" width="480" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <circle cx="144" cy="132" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="137" fill="#2d3142" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">2</text>
        <text x="176" y="128" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Measure background CPU load</text>
        <text x="176" y="148" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">CPU time per process, as logical CPUs used</text>

        <!-- 3 (accent: Rust decision) -->
        <rect x="120" y="184" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="184" width="480" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <circle cx="144" cy="212" r="12" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        <text x="144" y="217" fill="#bf4520" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3</text>
        <text x="176" y="208" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Rust: confine on or off</text>
        <text x="176" y="228" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">On at 0.50 logical CPUs, off below 0.25</text>
        <text x="616" y="217" fill="#bf4520" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Rust decides</text>

        <!-- 4 -->
        <rect x="120" y="264" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="264" width="480" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <circle cx="144" cy="292" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="297" fill="#2d3142" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4</text>
        <text x="176" y="288" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Apply background CPU set</text>
        <text x="176" y="308" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Background set when on, empty when off</text>

        <!-- 5 -->
        <rect x="120" y="344" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="344" width="480" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <circle cx="144" cy="372" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="377" fill="#2d3142" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">5</text>
        <text x="176" y="368" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Per-process policy (EcoQoS, memory, I/O)</text>
        <text x="176" y="388" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">EcoQoS on all targets; Throttle adds more</text>

        <!-- 6 (accent: Rust decision) -->
        <rect x="120" y="424" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="424" width="480" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <circle cx="144" cy="452" r="12" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
        <text x="144" y="457" fill="#bf4520" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6</text>
        <text x="176" y="448" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Rust: purge decision</text>
        <text x="176" y="468" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Thresholds, cooldown, disk gate</text>
        <text x="616" y="457" fill="#bf4520" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Rust decides</text>

        <!-- 7 -->
        <rect x="120" y="504" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="504" width="480" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <circle cx="144" cy="532" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="537" fill="#2d3142" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">7</text>
        <text x="176" y="528" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Trim working sets and purge standby list</text>
        <text x="176" y="548" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Standby purge needs Administrator rights</text>

        <!-- 8 -->
        <rect x="120" y="584" width="480" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="584" width="480" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <circle cx="144" cy="612" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="617" fill="#2d3142" font-size="14" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">8</text>
        <text x="176" y="608" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Restore tracked changes on exit</text>
        <text x="176" y="628" fill="#4f5d75" font-size="14" font-family="'Geist Mono', ui-monospace, monospace">Undo each tracked change, clear the list</text>
      </svg>
    </div>
  </div>
</body>
</html>
