<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matriz de seguridad · Anti-cheat</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Seguridad · VegaFlow Universal</p>
    <h1>Matriz de decisión de seguridad · Anti-cheat</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="matriz-seguridad-anticheat-title matriz-seguridad-anticheat-desc">
      <title id="matriz-seguridad-anticheat-title">Matriz de decisión de seguridad · Anti-cheat</title>
      <desc id="matriz-seguridad-anticheat-desc">Si se detecta un anti-cheat, VegaFlow sigue la ruta no invasiva, que solo cambia ajustes de Windows y prohíbe modificar o inyectar archivos; si no, sigue la ruta completa, que añade DXVK, presets del motor y purga de memoria.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
      <path d="M350,132 L268,132 Q260,132 260,140 L260,264" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M650,132 L732,132 Q740,132 740,140 L740,264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="292" y="104" width="32" height="16" fill="#f5f5f5"/>
      <text x="308" y="116" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em" font-weight="600">SÍ</text>
      <rect x="676" y="104" width="32" height="16" fill="#f5f5f5"/>
      <text x="692" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
      <polygon points="350,132 500,72 650,132 500,192" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="137" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Se detecta anti-cheat?</text>
      <text x="500" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">HoYoKProtect · Vanguard · EAC · BattlEye · ACE · mhypbase…</text>
      <rect x="80" y="264" width="360" height="236" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="96" y="280" width="110" height="16" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.5"/>
      <text x="102" y="292" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CON ANTI-CHEAT</text>
      <text x="104" y="324" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Ruta no invasiva</text>
      <text x="416" y="324" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end"></text>
      <text x="104" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">1. DXGI Flip Model vía registro</text>
      <text x="104" y="378" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">2. CPU Sets cooperativos</text>
      <text x="104" y="400" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">3. Temporizador NT a 0.5 ms</text>
      <text x="104" y="422" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">4. MMCSS Gaming: prioridad GPU 8</text>
      <text x="104" y="444" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace">5. PROHIBIDO modificar o inyectar</text>
      <text x="140" y="466" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace">archivos (LOCKDOWN total</text>
      <text x="140" y="488" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace">de SandboxGuard)</text>
      <rect x="560" y="264" width="360" height="236" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="576" y="280" width="110" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.5"/>
      <text x="582" y="292" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SIN ANTI-CHEAT</text>
      <text x="584" y="324" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Ruta completa</text>
      <text x="896" y="324" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">nativa + motor</text>
      <text x="584" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">1. DXGI Flip Model (registro)</text>
      <text x="584" y="378" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">2. CPU Sets cooperativos</text>
      <text x="584" y="400" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">3. DXVK-GPLAsync en la carpeta</text>
      <text x="584" y="422" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">4. Presets UMA Engine.ini /</text>
      <text x="620" y="444" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">boot.config con .vegaflow.bak</text>
      <text x="584" y="466" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">5. Purga de memoria inteligente</text>
      <text x="80" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCO</text>
      <text x="136" y="548" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Con anti-cheat solo se tocan ajustes de Windows: ningún archivo del juego se modifica ni se inyecta.</text>

    </svg>
    </div>
  </div>
</body>
</html>
