<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reparto de núcleos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Fase 7 · VegaFlow Universal</p>
    <h1>Cómo se reparten los núcleos entre el juego y el fondo</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reparto-title reparto-desc">
      <title id="reparto-title">Cómo se reparten los núcleos entre el juego y el fondo</title>
      <desc id="reparto-desc">Con los CPU Sets de un grupo de procesadores, la regla pregunta primero si hay clases de eficiencia distintas (híbrida: el juego va a los P-cores y el fondo a los E-cores, sin los de bajo consumo). Si no, pregunta si hay varios bloques de caché y 6 o más núcleos físicos: con un bloque secundario pequeño, el fondo va a esa isla; si no, al último núcleo físico. Si no hay varios bloques, el fondo va al último núcleo físico.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- flechas -->
      <line x1="210" y1="78" x2="210" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="150" x2="470" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="210" y1="200" x2="210" y2="270" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="320" x2="395" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="210" y1="370" x2="210" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="525" y1="370" x2="525" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M655,320 H817 Q825,320 825,328 V418" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- etiquetas de las ramas -->
      <rect x="392" y="130" width="40" height="16" fill="#f5f5f5"/>
      <text x="412" y="142" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">sí</text>
      <rect x="222" y="226" width="40" height="16" fill="#f5f5f5"/>
      <text x="242" y="238" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">no</text>
      <rect x="362" y="300" width="30" height="16" fill="#f5f5f5"/>
      <text x="377" y="312" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">sí</text>
      <rect x="222" y="386" width="40" height="16" fill="#f5f5f5"/>
      <text x="242" y="398" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">no</text>
      <rect x="537" y="386" width="30" height="16" fill="#f5f5f5"/>
      <text x="552" y="398" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">sí</text>
      <rect x="700" y="300" width="40" height="16" fill="#f5f5f5"/>
      <text x="720" y="312" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">no</text>

      <!-- inicio -->
      <rect x="60" y="30" width="300" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="210" y="59" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">CPU Sets de un grupo de procesadores</text>

      <!-- decisión 1 -->
      <polygon points="60,150 210,100 360,150 210,200" fill="#f8ebe6" stroke="#bf4520" stroke-width="1.2"/>
      <text x="210" y="146" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">¿Clases de eficiencia</text>
      <text x="210" y="162" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">distintas entre núcleos?</text>

      <!-- híbrida -->
      <rect x="470" y="95" width="470" height="110" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="486" y="122" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Híbrida (Intel P-cores y E-cores)</text>
      <text x="486" y="146" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Juego: los núcleos de mayor eficiencia, salvo el</text>
      <text x="486" y="162" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  primero si hay 4 o más.</text>
      <text x="486" y="178" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Fondo: los E-cores. Los de bajo consumo (LP E-cores)</text>
      <text x="486" y="194" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  quedan fuera: los decide Windows.</text>

      <!-- decisión 2 -->
      <polygon points="60,320 210,270 360,320 210,370" fill="#f8ebe6" stroke="#bf4520" stroke-width="1.2"/>
      <text x="210" y="316" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">¿Varios bloques de caché</text>
      <text x="210" y="332" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">y 6 o más núcleos físicos?</text>

      <!-- decisión 3 -->
      <polygon points="395,320 525,270 655,320 525,370" fill="#f8ebe6" stroke="#bf4520" stroke-width="1.2"/>
      <text x="525" y="308" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">¿Bloque secundario pequeño</text>
      <text x="525" y="322" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">(un tercio de los hilos o menos)</text>
      <text x="525" y="336" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">y sin el primer núcleo?</text>

      <!-- resultados -->
      <rect x="60" y="420" width="300" height="120" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="76" y="446" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Monolítica o uniforme</text>
      <text x="76" y="470" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Fondo: el último núcleo físico</text>
      <text x="76" y="486" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  (sus hilos si hay 4 o más; si no, 1).</text>
      <text x="76" y="502" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Juego: el resto, sin el núcleo 0 si</text>
      <text x="76" y="518" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  hay 4 o más núcleos físicos.</text>

      <rect x="400" y="420" width="250" height="120" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="416" y="446" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Isla compacta</text>
      <text x="416" y="470" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Fondo: todo el bloque pequeño.</text>
      <text x="416" y="486" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Juego: el resto, sin el núcleo 0</text>
      <text x="416" y="502" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  si hay 4 o más núcleos físicos.</text>

      <rect x="690" y="420" width="270" height="120" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="706" y="446" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Bloques simétricos</text>
      <text x="706" y="470" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Fondo: el último núcleo físico.</text>
      <text x="706" y="486" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">· Juego: el resto, sin el núcleo 0,</text>
      <text x="706" y="502" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  empezando por el bloque con</text>
      <text x="706" y="518" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">  menos fondo y más núcleos libres.</text>

      <text x="60" y="584" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FOCO</text>
      <text x="156" y="584" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-style="italic">La regla corre dentro de un solo grupo de procesadores (hasta 64 hilos lógicos) y vive en cpu_governor.rs.</text>
    </svg>
    </div>
  </div>
</body>
</html>
