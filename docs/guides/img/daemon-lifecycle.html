<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daemon lifecycle · Process governance</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; max-width: 700px; display: block; margin: 0 auto; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · VegaFlow Universal</p>
    <h1>Daemon lifecycle · Process governance</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daemon-lifecycle-title daemon-lifecycle-desc">
        <title id="daemon-lifecycle-title">Daemon lifecycle · Process governance</title>
        <desc id="daemon-lifecycle-desc">State diagram of the daemon: it waits while idle, confines background processes while a 3D game is in front, purges memory only under memory pressure, and restores everything when the game closes.</desc>
<g transform="translate(0,-56)">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect x="0" y="56" width="800" height="592" fill="#f5f5f5"/>

        <!-- Arrows first, so they sit behind labels and nodes -->
        <path d="M208 364 H316" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M436 312 V172 A8 8 0 0 1 444 164 H592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M676 216 V312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M592 364 H484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M380 312 V172 A8 8 0 0 0 372 164 H208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M124 216 V312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M400 416 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M436 512 V416" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels: opaque masks, 8-10 px clear of the stroke -->
        <rect x="212" y="340" width="100" height="14" rx="2" fill="#f5f5f5"/>
        <text x="262" y="352" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">game opens</text>

        <rect x="468" y="142" width="92" height="14" rx="2" fill="#f5f5f5"/>
        <text x="514" y="153" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">above 0.5</text>

        <rect x="686" y="258" width="100" height="14" rx="2" fill="#f5f5f5"/>
        <text x="694" y="270" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif">below 0.25</text>

        <rect x="505" y="340" width="66" height="14" rx="2" fill="#f5f5f5"/>
        <text x="538" y="352" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">resume</text>

        <rect x="240" y="142" width="108" height="14" rx="2" fill="#f5f5f5"/>
        <text x="294" y="153" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">game closes</text>

        <rect x="134" y="256" width="83" height="14" rx="2" fill="#f5f5f5"/>
        <text x="142" y="268" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif">restored</text>

        <rect x="248" y="456" width="142" height="14" rx="2" fill="#f5f5f5"/>
        <text x="382" y="468" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="end">memory pressure</text>

        <rect x="446" y="456" width="117" height="14" rx="2" fill="#f5f5f5"/>
        <text x="454" y="468" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif">back to play</text>

        <!-- Node A: Restored -->
        <rect x="40" y="112" width="168" height="104" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="124" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Restored</text>
        <text x="124" y="168" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">RestoreAll()</text>
        <text x="124" y="186" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">normal settings</text>

        <!-- Node B: Idle -->
        <rect x="40" y="312" width="168" height="104" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="124" y="344" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Idle</text>
        <text x="124" y="368" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">WaitForMultiple</text>
        <text x="124" y="386" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">every 1.5 s</text>
        <text x="124" y="404" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">about 2 MB RAM</text>

        <!-- Node C: Game in front (focal) -->
        <rect x="316" y="312" width="168" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="316" y="312" width="168" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="400" y="344" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Game in front</text>
        <text x="400" y="368" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3D game</text>
        <text x="400" y="386" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">in foreground</text>

        <!-- Node D: Confined -->
        <rect x="592" y="112" width="168" height="104" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="676" y="144" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Confined</text>
        <text x="676" y="168" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">background cores</text>
        <text x="676" y="186" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">EcoQoS + low I/O</text>

        <!-- Node E: Released -->
        <rect x="592" y="312" width="168" height="104" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="676" y="344" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Released</text>
        <text x="676" y="368" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">confinement off</text>

        <!-- Node F: Purge memory -->
        <rect x="316" y="512" width="168" height="104" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="400" y="544" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Purge memory</text>
        <text x="400" y="568" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">only under</text>
        <text x="400" y="586" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">memory pressure</text>
      </g>
</svg>
    </div>
  </div>
</body>
</html>
