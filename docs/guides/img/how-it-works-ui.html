<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the ui layer works, step by step</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 800px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flow · Diagram Design</p>
    <h1>How the ui layer works, step by step</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-ui-title how-it-works-ui-desc">
        <title id="how-it-works-ui-title">How the ui layer works, step by step</title>
        <desc id="how-it-works-ui-desc">The window starts once and then, every 1.5 seconds, polls telemetry and paints a screen model built in session/; button presses, tab switches and a second start reach the app or bring the window to the front.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, so the boxes sit on top of them -->
        <g stroke="#4f5d75" stroke-width="1" fill="none">
          <line x1="240" y1="128" x2="300" y2="128" marker-end="url(#arrow)"/>
          <line x1="500" y1="128" x2="560" y2="128" marker-end="url(#arrow)"/>
          <line x1="660" y1="168" x2="660" y2="232" marker-end="url(#arrow)"/>
          <line x1="560" y1="272" x2="500" y2="272" marker-end="url(#arrow)"/>
          <line x1="400" y1="376" x2="400" y2="312" marker-end="url(#arrow)"/>
          <line x1="660" y1="376" x2="660" y2="312" marker-end="url(#arrow)"/>
          <line x1="140" y1="376" x2="140" y2="312" marker-end="url(#arrow)"/>
        </g>

        <!-- Label on the tick arrow: opaque mask, 8 px gap from the line -->
        <rect x="668" y="188" width="88" height="20" rx="2" fill="#f5f5f5"/>
        <text x="676" y="202" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif">every 1.5 s</text>

        <!-- Row 1: starts once -->
        <!-- 1 Create window -->
        <rect x="40" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="140" y="122" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">1. Create window</text>
        <text x="140" y="142" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">1120 × 740 window</text>

        <!-- 2 Start tray icon and timer -->
        <rect x="300" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="400" y="122" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">2. Start tray icon</text>
        <text x="400" y="142" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">and 1.5 s timer</text>

        <!-- 3 Each tick: poll telemetry -->
        <rect x="560" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="660" y="122" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">3. Each tick</text>
        <text x="660" y="142" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">poll telemetry</text>

        <!-- Row 2: every tick -->
        <!-- 9 Window comes to front -->
        <rect x="40" y="232" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="232" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="140" y="266" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">9. Window in front</text>
        <text x="140" y="286" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">shows and focuses</text>

        <!-- 5 Paint screen -->
        <rect x="300" y="232" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="232" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="400" y="266" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">5. Paint screen</text>
        <text x="400" y="286" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">GDI and native buttons</text>

        <!-- 4 Build model (focal: the model decides) -->
        <rect x="560" y="232" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="232" width="200" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="660" y="266" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">4. Build model</text>
        <text x="660" y="286" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">in session/</text>

        <!-- Row 3: when the person acts -->
        <!-- 8 Second start -->
        <rect x="40" y="376" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="376" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="140" y="410" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">8. Second start</text>
        <text x="140" y="430" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">restore message</text>

        <!-- 6 Button press or click -->
        <rect x="300" y="376" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="376" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="400" y="410" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">6. Button press</text>
        <text x="400" y="430" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">or click</text>

        <!-- 7 Switch tab -->
        <rect x="560" y="376" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="376" width="200" height="80" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="660" y="410" fill="#2d3142" font-size="14" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">7. Switch tab</text>
        <text x="660" y="430" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif" text-anchor="middle">shows and refreshes</text>

        <!-- Legend strip -->
        <line x1="40" y1="480" x2="760" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="504" fill="#4f5d75" font-size="14" font-family="Geist, system-ui, sans-serif">1-2 run once · 3-5 repeat every tick · 6-9 run when the person acts</text>
      </svg>
    </div>
  </div>
</body>
</html>
