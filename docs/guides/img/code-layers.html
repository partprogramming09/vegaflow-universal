<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 700px; max-width: 100%; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Code layers · VegaFlow Universal</p>
    <h1>Code layers: who may include whom</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-layers-title code-layers-desc">
        <title id="code-layers-title">Code layers: who may include whom</title>
        <desc id="code-layers-desc">A stack of src/ folders, from app/ at the top to model/ at the bottom, with arrows for the main may-include relations; session/ holds the use cases and is highlighted.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first, then nodes. Arrow = "may include". -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
          <line x1="400" y1="96" x2="400" y2="136"/>
          <line x1="400" y1="200" x2="400" y2="240"/>
          <line x1="400" y1="304" x2="400" y2="344"/>
          <line x1="400" y1="408" x2="400" y2="448"/>
          <path d="M240,272 H168 Q160,272 160,280 V448"/>
          <line x1="320" y1="480" x2="280" y2="480"/>
          <line x1="440" y1="512" x2="440" y2="552"/>
          <line x1="160" y1="512" x2="160" y2="656"/>
        </g>

        <!-- app/ -->
        <rect x="240" y="32" width="320" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="58" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">app/ · entry points</text>
        <text x="400" y="78" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">main, CLI, daemon, GUI, monitor</text>

        <!-- ui/ -->
        <rect x="240" y="136" width="320" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="162" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">ui/ · Win32/GDI window</text>
        <text x="400" y="182" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">draws what session/ prepares</text>

        <!-- session/ (accent) -->
        <rect x="240" y="240" width="320" height="64" rx="6" fill="#f8ebe6" stroke="#bf4520" stroke-width="1.2"/>
        <text x="400" y="266" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">session/ · use cases</text>
        <text x="400" y="286" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">no Win32 calls</text>

        <!-- migration -->
        <rect x="240" y="344" width="320" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="370" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">migration: detect/, optimize/</text>
        <text x="400" y="390" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">moving to ports, phase by phase</text>

        <!-- ports/ -->
        <rect x="40" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="160" y="474" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">ports/ · interfaces</text>
        <text x="160" y="494" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">tests swap in fakes</text>

        <!-- windows/ -->
        <rect x="320" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="440" y="474" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">windows/ · adapters</text>
        <text x="440" y="494" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">every call to Windows</text>

        <!-- bridge/ -->
        <rect x="320" y="552" width="240" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="440" y="578" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">bridge/ → Rust core</text>
        <text x="440" y="598" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">pure rules, no I/O</text>

        <!-- model/ -->
        <rect x="40" y="656" width="720" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="682" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">model/ · shared types</text>
        <text x="400" y="702" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">no logic; every layer uses it</text>

        <text x="40" y="752" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif">Arrow: may include (main relations; full table on the index page)</text>
      </svg>
    </div>
  </div>
</body>
</html>
