<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU starvation without and with VegaFlow isolation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    /* The viewBox is 800 wide; it is shown at 700 px so the 14 px labels stay legible. */
    svg { width: 700px; max-width: 100%; height: auto; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>GPU starvation: without and with isolation</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpu-starvation-sequence-title gpu-starvation-sequence-desc">
        <title id="gpu-starvation-sequence-title">GPU starvation without and with VegaFlow isolation</title>
        <desc id="gpu-starvation-sequence-desc">Sequence of two cases: without isolation, a background app interrupts the CPU, commands stop reaching the GPU and the frame arrives late; with VegaFlow, the background app stays on the last core and the CPU keeps a steady flow of commands to the GPU.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines first, so the section strips and labels sit on top of them -->
        <line x1="112" y1="80" x2="112" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="304" y1="80" x2="304" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="496" y1="80" x2="496" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="688" y1="80" x2="688" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Actors -->
        <rect x="24" y="32" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="112" y="61" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Background app</text>
        <rect x="216" y="32" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="304" y="61" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CPU (game thread)</text>
        <rect x="408" y="32" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="496" y="61" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bus</text>
        <rect x="600" y="32" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="688" y="61" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GPU</text>

        <!-- Case A: without isolation -->
        <rect x="0" y="100" width="800" height="28" fill="#ececec"/>
        <text x="400" y="119" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A. Without isolation</text>

        <!-- A1: background app interrupts the CPU -->
        <line x1="112" y1="172" x2="304" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="152" y="144" width="112" height="20" rx="2" fill="#f5f5f5"/>
        <text x="208" y="158" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Preempts CPU</text>

        <!-- A2: commands stop flowing to the bus -->
        <line x1="304" y1="212" x2="496" y2="212" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="344" y="184" width="112" height="20" rx="2" fill="#f5f5f5"/>
        <text x="400" y="198" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Command gap</text>

        <!-- GPU idles while it has no work -->
        <text x="592" y="248" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GPU waits for work</text>

        <!-- A4: the late frame (accent) -->
        <line x1="496" y1="292" x2="688" y2="292" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="540" y="264" width="104" height="20" rx="2" fill="#f5f5f5"/>
        <text x="592" y="278" fill="#bf4520" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Late frame</text>
        <text x="592" y="312" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Drop in 1% low</text>

        <!-- Case B: with VegaFlow -->
        <rect x="0" y="340" width="800" height="28" fill="#ececec"/>
        <text x="400" y="359" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">B. With VegaFlow</text>

        <text x="124" y="404" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">Pinned to last core</text>

        <!-- B2: steady command flow to the bus -->
        <line x1="304" y1="436" x2="496" y2="436" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="312" y="408" width="176" height="20" rx="2" fill="#f5f5f5"/>
        <text x="400" y="422" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Steady command flow</text>

        <!-- B3: frame on time -->
        <line x1="496" y1="476" x2="688" y2="476" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="528" y="448" width="128" height="20" rx="2" fill="#f5f5f5"/>
        <text x="592" y="462" fill="#5a6580" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Frame on time</text>
      </svg>
    </div>
  </div>
</body>
</html>
