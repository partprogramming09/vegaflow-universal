<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capas del código</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Capas · VegaFlow Universal</p>
    <h1>Capas del código: quién puede incluir a quién</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capas-title capas-desc">
      <title id="capas-title">Capas del código de VegaFlow: quién puede incluir a quién</title>
      <desc id="capas-desc">Las entradas app/ usan la ventana ui/ y los casos de uso session/. Los casos de uso piden sus lecturas de Windows a windows/ (system_counters y text_convert) y hablan con los puertos ports/. Los adaptadores de windows/ implementan los puertos y llaman al núcleo Rust a través de bridge/. Los tipos de model/ los usan todas las capas.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- flechas entre capas: "incluye a" -->
      <line x1="450" y1="100" x2="450" y2="130" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="200" x2="450" y2="230" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="300" x2="450" y2="330" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="400" x2="280" y2="430" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="680" y1="400" x2="680" y2="430" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="490" y1="475" x2="530" y2="475" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="530" x2="280" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- R3: session/ pide sus lecturas a windows/ -->
      <path d="M70,265 H44 Q36,265 36,273 V467 Q36,475 44,475 H68" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="22" y="370" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" transform="rotate(-90 22 370)">R3: lecturas de Windows</text>

      <!-- capa 1: app -->
      <rect x="70" y="30" width="760" height="70" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="90" y="58" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">app/ · entradas</text>
      <text x="90" y="80" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">main, línea de comandos, bucle del daemon, ventana (--gui) y monitor. Solo orquestan.</text>

      <!-- capa 2: ui -->
      <rect x="70" y="130" width="760" height="70" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="90" y="158" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">ui/ · ventana Win32/GDI</text>
      <text x="90" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Dibuja lo que prepara session/. app_identity.hpp guarda versión, título de ventana y bandeja.</text>

      <!-- capa 3: session -->
      <rect x="70" y="230" width="760" height="70" rx="6" fill="#f8ebe6" stroke="#bf4520" stroke-width="1.2"/>
      <text x="90" y="258" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">session/ · casos de uso</text>
      <text x="90" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Ciclo de juego, informes, SystemInfo, config.json y restauración. Ya no llama a Win32.</text>

      <!-- capa 4: detect + optimize -->
      <rect x="70" y="330" width="760" height="70" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="90" y="358" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">detect/ y optimize/ · en migración</text>
      <text x="90" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Qué hardware y juego hay, y las palancas. Pasan a puertos fase a fase (strangler).</text>

      <!-- capa 5: windows (izquierda) y ports (derecha) -->
      <rect x="70" y="430" width="420" height="100" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="90" y="458" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">windows/ · adaptadores</text>
      <text x="90" y="480" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Win32, ntdll, DXGI, registro, energía, procesos.</text>
      <text x="90" y="498" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace">system_counters y text_convert (nuevos en R3).</text>
      <text x="90" y="516" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Implementa los puertos: toda llamada a Windows.</text>

      <rect x="530" y="430" width="300" height="100" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="550" y="458" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">ports/ · interfaces</text>
      <text x="550" y="480" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">archivos, reloj, procesos, registro,</text>
      <text x="550" y="498" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">energía, equipo, memoria, diario.</text>
      <text x="550" y="516" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Las pruebas los sustituyen.</text>

      <!-- capa 6: bridge + núcleo Rust -->
      <rect x="70" y="572" width="760" height="70" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="90" y="600" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">bridge/ → rust/vegaflow-core · decide</text>
      <text x="90" y="622" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Reglas puras, sin E/S. El C++ las llama por funciones vf_rust_* y actúa según su respuesta.</text>

      <!-- model: tira lateral -->
      <rect x="860" y="30" width="90" height="612" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="905" y="300" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">model/</text>
      <text x="905" y="324" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">tipos</text>
      <text x="905" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">compartidos,</text>
      <text x="905" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">sin lógica</text>
      <text x="905" y="380" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">todas las</text>
      <text x="905" y="396" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">capas lo usan</text>

      <text x="70" y="690" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FOCO</text>
      <text x="166" y="690" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Las flechas van hacia abajo: nadie incluye una capa de arriba. scripts/check_layers.sh lo comprueba.</text>
    </svg>
    </div>
  </div>
</body>
</html>
