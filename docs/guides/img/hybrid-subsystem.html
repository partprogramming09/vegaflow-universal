<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid subsystem · One binary</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 700px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · VegaFlow Universal</p>
    <h1>Hybrid subsystem · How C++ and Rust are linked into one binary</h1>
    <div class="scroll">
    <svg viewBox="0 0 800 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hybrid-subsystem-title hybrid-subsystem-desc">
      <title id="hybrid-subsystem-title">Hybrid subsystem · One binary</title>
      <desc id="hybrid-subsystem-desc">The C++20 layer calls the Rust policy modules through rust_bridge.h, and the Rust staticlib is linked with MinGW-w64 g++ into vegaflow_daemon.exe and vegaflow_tests.exe.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="800" height="576" fill="#f5f5f5"/>

      <!-- Arrows first, so nodes sit above them -->
      <g stroke="#4f5d75" stroke-width="1.2" fill="none">
        <line x1="240" y1="224" x2="288" y2="224" marker-end="url(#arrow)"/>
        <line x1="464" y1="136" x2="544" y2="136" marker-end="url(#arrow)"/>
        <line x1="464" y1="196" x2="544" y2="196" marker-end="url(#arrow)"/>
        <line x1="464" y1="256" x2="544" y2="256" marker-end="url(#arrow)"/>
        <line x1="464" y1="316" x2="544" y2="316" marker-end="url(#arrow)"/>
        <line x1="140" y1="280" x2="140" y2="432" marker-end="url(#arrow)"/>
      </g>
      <g stroke="#bf4520" stroke-width="1.2" fill="none">
        <path d="M600 360 V392 Q600 400 592 400 H198 Q190 400 190 408 V432" marker-end="url(#arrow-accent)"/>
        <path d="M680 360 V432" marker-end="url(#arrow-accent)"/>
      </g>
      <text x="400" y="380" fill="#bf4520" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">static link · MinGW-w64 g++</text>

      <!-- C++20 layer -->
      <rect x="40" y="168" width="200" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="210" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">C++20 layer</text>
      <text x="140" y="232" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">GUI, DXGI, registry</text>
      <text x="140" y="252" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">every Windows call</text>

      <!-- Bridge -->
      <rect x="288" y="120" width="176" height="208" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="376" y="212" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rust_bridge.h</text>
      <text x="376" y="236" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">plain C header</text>
      <text x="376" y="256" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace" text-anchor="middle">#[repr(C)] structs</text>

      <!-- Rust crate (container) -->
      <rect x="524" y="84" width="252" height="276" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="540" y="104" fill="#4f5d75" font-size="14" font-family="'Geist Mono', monospace">libvegaflow_core.a</text>

      <!-- Policy modules -->
      <rect x="544" y="112" width="212" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="650" y="141" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">cpu_governor.rs</text>
      <rect x="544" y="172" width="212" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="650" y="201" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">memory_purge.rs</text>
      <rect x="544" y="232" width="212" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="650" y="261" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">apu_tier.rs</text>
      <rect x="544" y="292" width="212" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="650" y="321" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">path_policy.rs</text>

      <!-- Executables -->
      <rect x="40" y="432" width="300" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="190" y="466" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vegaflow_daemon.exe</text>
      <rect x="460" y="432" width="300" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="610" y="466" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vegaflow_tests.exe</text>

      <!-- Footer -->
      <text x="40" y="520" fill="#bf4520" font-size="14" font-family="'Geist', sans-serif">Static link: MinGW-w64 g++ puts libvegaflow_core.a into both executables.</text>
      <text x="40" y="544" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif">panic = unwind lets ffi_guard catch Rust panics before they reach C++.</text>
    </svg>
    </div>
  </div>
</body>
</html>
