<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subsistema híbrido · Un solo binario</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · VegaFlow Universal</p>
    <h1>Subsistema híbrido · Qué clase C++ llama a qué módulo Rust</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="subsistema-hibrido-title subsistema-hibrido-desc">
      <title id="subsistema-hibrido-title">Subsistema híbrido · Un solo binario</title>
      <desc id="subsistema-hibrido-desc">Dentro del binario único vegaflow_daemon.exe, MemoryManager, HardwareProfiler, CpuOrchestrator y SandboxGuard de la capa C++20 llaman a través de rust_bridge.h a uma_memory.rs, cpu_governor.rs y sandbox_core.rs del crate rust/vegaflow-core.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Contenedor: binario único -->
      <rect x="40" y="48" width="920" height="540" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="64" y="76" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BINARIO ÚNICO</text>
      <text x="64" y="100" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">vegaflow_daemon.exe</text>
      <text x="936" y="100" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Enlace Estático MinGW-w64 (g++ 16.2 + Rust)</text>

      <!-- Zona C++20 -->
      <rect x="64" y="120" width="240" height="444" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="72" y="124" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="110" y="133" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CAPA C++20</text>
      <text x="80" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">GUI Win32/GDI · DXGI/D3D COM</text>
      <text x="80" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Registro Windows · Orquestación Win32</text>

      <!-- Zona crate Rust -->
      <rect x="576" y="120" width="360" height="444" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="584" y="124" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="622" y="133" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CRATE RUST</text>
      <text x="600" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">rust/vegaflow-core</text>
      <text x="600" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">staticlib + rlib · panic="unwind" · opt-level=3</text>

      <!-- Flechas: C++ → puente -->
      <line x1="280" y1="212" x2="358" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="276" x2="358" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="340" x2="358" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="404" x2="358" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Flechas: puente → Rust -->
      <line x1="520" y1="212" x2="598" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="276" x2="598" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="340" x2="598" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="404" x2="598" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nodos C++ -->
      <rect x="88" y="192" width="192" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="216" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MemoryManager</text>
      <rect x="88" y="256" width="192" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="280" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HardwareProfiler</text>
      <rect x="88" y="320" width="192" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="344" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CpuOrchestrator</text>
      <rect x="88" y="384" width="192" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="408" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SandboxGuard</text>

      <!-- Puente (focal) -->
      <rect x="360" y="184" width="160" height="248" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="184" width="160" height="248" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="368" y="192" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="388" y="201" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FFI</text>
      <text x="440" y="292" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rust_bridge.h</text>
      <text x="440" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">src/bridge/</text>
      <text x="440" y="338" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Contrato #[repr(C)] FFI</text>
      <text x="440" y="354" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Cero Heap / Zero-Copy</text>

      <!-- Nodos Rust -->
      <rect x="600" y="192" width="312" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="216" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">uma_memory.rs</text>
      <rect x="600" y="256" width="312" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cpu_governor.rs</text>
      <rect x="600" y="384" width="312" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="408" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sandbox_core.rs</text>

      <!-- Propiedades del crate -->
      <text x="600" y="460" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Llamadas nativas NTDLL</text>
      <text x="600" y="476" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">NtQuerySystemInformation / NtSetSystemInformation</text>
      <text x="600" y="508" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">Cálculos deterministas en pila</text>
      <text x="600" y="524" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">sin std::vector / std::string en bucle activo</text>

      <!-- Pie -->
      <text x="40" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PUENTE</text>
      <text x="136" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Cada clase C++ cruza el contrato C de rust_bridge.h para llegar a su módulo Rust; todo queda enlazado en un único ejecutable.</text>
    </svg>
    </div>
  </div>
</body>
</html>
