<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topología AMD vs. Intel</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Patrón universal · VegaFlow Universal</p>
    <h1>Topología física: AMD Ryzen vs. Intel Core</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topologia-amd-intel-title topologia-amd-intel-desc">
      <title id="topologia-amd-intel-title">Topología física: AMD Ryzen vs. Intel Core</title>
      <desc id="topologia-amd-intel-desc">AMD Ryzen se divide en APU monolítica, con caché L3 compacta y bus Infinity Fabric compartido con la iGPU, y en desktop multi-CCD, donde CCD 0 y CCD 1 se comunican por el I/O Die con penalización Cross-CCD; Intel Core híbrido une P-Cores, E-Cores y la Smart Cache L3 por un mismo Ring Bus.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ================= ZONAS ================= -->
      <!-- AMD Ryzen -->
      <rect x="40" y="48" width="440" height="568" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <rect x="52" y="52" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="56" y="61" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AMD RYZEN (ZEN 2 A ZEN 5)</text>

      <!-- APU monolítica -->
      <rect x="64" y="80" width="392" height="112" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <rect x="76" y="84" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="80" y="93" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">APU MONOLÍTICA (LUCIENNE / PHOENIX)</text>
      <text x="88" y="132" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Caché L3 Compacta <tspan fill="#4f5d75" font-weight="400" font-size="11" font-family="'Geist Mono', monospace">(8-16 MB)</tspan></text>
      <text x="88" y="164" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Bus Infinity Fabric (FCLK) <tspan fill="#4f5d75" font-weight="400" font-size="11" font-family="'Geist', sans-serif">unificado con iGPU</tspan></text>

      <!-- Desktop / HX -->
      <rect x="64" y="216" width="392" height="376" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <rect x="76" y="220" width="184" height="12" rx="2" fill="#f5f5f5"/>
      <text x="80" y="229" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DESKTOP / HX (MULTI-CCD / X3D)</text>

      <!-- Intel Core -->
      <rect x="520" y="48" width="440" height="568" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <rect x="532" y="52" width="240" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="61" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INTEL CORE (12ª A 14ª GEN Y CORE ULTRA)</text>

      <!-- Arquitectura híbrida -->
      <rect x="544" y="80" width="392" height="512" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <rect x="556" y="84" width="232" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="93" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ARQUITECTURA HÍBRIDA P-CORES + E-CORES</text>

      <!-- ================= CONECTORES ================= -->
      <!-- CCD 0 ↔ I/O Die (focal: penalización Cross-CCD) -->
      <line x1="260" y1="318" x2="260" y2="402" stroke="#bf4520" stroke-width="1.4" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
      <rect x="268" y="338" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="347" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">PENALIZACIÓN CROSS-CCD</text>
      <rect x="268" y="354" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="363" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">(~70+ ns)</text>
      <!-- I/O Die ↔ CCD 1 -->
      <line x1="260" y1="462" x2="260" y2="518" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

      <!-- P-Cores ↔ Ring Bus -->
      <line x1="740" y1="206" x2="740" y2="306" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <!-- Ring Bus ↔ Smart Cache L3 -->
      <line x1="648" y1="358" x2="648" y2="458" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <!-- Ring Bus ↔ E-Cores -->
      <line x1="832" y1="358" x2="832" y2="458" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

      <!-- ================= NODOS ================= -->
      <!-- CCD 0 -->
      <rect x="120" y="260" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="260" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="284" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CCD 0</text>
      <text x="260" y="302" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Caché 3D V-Cache / Núcleos 0-7</text>

      <!-- I/O Die -->
      <rect x="120" y="404" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="404" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="428" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">I/O Die Central</text>
      <text x="260" y="446" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Controlador de Memoria</text>

      <!-- CCD 1 -->
      <rect x="120" y="520" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="520" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="544" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CCD 1</text>
      <text x="260" y="562" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Núcleos de Frecuencia 8-15</text>

      <!-- P-Cores -->
      <rect x="600" y="148" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="148" width="280" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="740" y="172" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">P-Cores (Raptor Cove)</text>
      <text x="740" y="190" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Alto IPC / Frecuencia Pico</text>

      <!-- Ring Bus (focal) -->
      <rect x="568" y="308" width="344" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="308" width="344" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="740" y="337" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ring Bus Unificado de Alta Velocidad</text>

      <!-- Smart Cache L3 -->
      <rect x="568" y="460" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="460" width="160" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="648" y="484" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Intel Smart Cache</text>
      <text x="648" y="502" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">L3 Compartida</text>

      <!-- E-Cores -->
      <rect x="752" y="460" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="460" width="160" height="56" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="832" y="484" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E-Cores (Gracemont)</text>
      <text x="832" y="502" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Clusters de 4 núcleos</text>

      <!-- ================= LEYENDA ================= -->
      <line x1="40" y1="636" x2="960" y2="636" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="662" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>
      <rect x="120" y="653" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="142" y="662" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Punto de contención que describe el texto</text>
      <line x1="400" y1="658" x2="432" y2="658" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="444" y="662" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Enlace en ambos sentidos</text>
    </svg>
    </div>
  </div>
</body>
</html>
