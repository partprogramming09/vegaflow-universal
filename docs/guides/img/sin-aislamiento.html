<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura sin aislamiento</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Antes · Sin aislamiento</p>
    <h1>Sin aislamiento: contención en caché L3, bus de memoria y presupuesto térmico</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sin-aislamiento-title sin-aislamiento-desc">
      <title id="sin-aislamiento-title">Sin aislamiento: contención en caché L3, bus de memoria y presupuesto térmico</title>
      <desc id="sin-aislamiento-desc">Los núcleos principales, los núcleos secundarios y el procesador gráfico compiten por el mismo bus de interconexión, punto de contención hacia la memoria RAM o VRAM: desalojos de caché L3, robo de cuotas y latencia de draw calls.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
      <rect x="120" y="80" width="520" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="136" y="98" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">COMPLEJO DE NÚCLEOS CPU · CACHÉ L3 UNIFICADA O PARTICIONADA</text>
      <line x1="256" y1="264" x2="256" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="508" y1="264" x2="508" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="768" y1="264" x2="768" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="500" y1="408" x2="500" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="136" y="112" width="240" height="152" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="148" y="134" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Núcleos principales 0-2</text>
      <text x="148" y="154" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Hilos del juego</text>
      <text x="148" y="168" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">GameThread / RenderThread</text>
      <text x="148" y="182" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Envenenados por hilos de</text>
      <text x="148" y="196" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Chrome/Discord</text>
      <text x="148" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HACIA EL BUS</text>
      <text x="148" y="236" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Desalojos constantes de L3</text>
      <text x="148" y="250" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">(Cache Thrashing)</text>
      <rect x="388" y="112" width="240" height="152" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="134" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Núcleos secundarios 3-5</text>
      <text x="400" y="154" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Workers de fondo, Indexador,</text>
      <text x="400" y="168" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Telemetría</text>
      <text x="400" y="182" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Migración constante entre</text>
      <text x="400" y="196" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">núcleos</text>
      <text x="400" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HACIA EL BUS</text>
      <text x="400" y="236" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Interrupciones de hilo y robo</text>
      <text x="400" y="250" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">de cuotas (Quantum Preemption)</text>
      <rect x="656" y="112" width="224" height="152" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="668" y="134" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Procesador gráfico</text>
      <text x="668" y="154" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">iGPU UMA / dGPU PCIe / eGPU TB4</text>
      <text x="668" y="168" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Hambriento esperando listas</text>
      <text x="668" y="182" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">de comandos D3D11/D3D12</text>
      <text x="668" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HACIA EL BUS</text>
      <text x="668" y="236" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Latencia de despacho de</text>
      <text x="668" y="250" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">draw calls elevada</text>
      <rect x="120" y="328" width="760" height="80" fill="rgba(191,69,32,0.08)"/>
      <rect x="120" y="328" width="760" height="80" fill="none" stroke="#bf4520" stroke-width="1"/>
      <text x="140" y="360" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">BUS</text>
      <text x="220" y="362" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" font-weight="600">Bus de interconexión</text>
      <text x="860" y="362" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Infinity Fabric / Ring Bus / Enlace PCIe</text>
      <text x="220" y="388" fill="#bf4520" font-size="11" font-family="'Geist', sans-serif">Punto de contención</text>
      <rect x="120" y="456" width="760" height="88" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MEMORIA</text>
      <text x="220" y="490" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" font-weight="600">Subsistema de memoria RAM / VRAM</text>
      <text x="220" y="516" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Líneas de caché desalojadas forzando accesos a memoria lenta</text>
      <text x="120" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FOCO</text>
      <text x="216" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Los núcleos y el procesador gráfico se cruzan en el mismo bus de interconexión antes de llegar a la memoria.</text>
    </svg>
    </div>
  </div>
</body>
</html>
