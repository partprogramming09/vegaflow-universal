<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How cores are split between the game and the background</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 700px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Phase 7 · VegaFlow Universal</p>
    <h1>How cores are split between the game and the background</h1>
    <div class="scroll">
    <svg viewBox="0 0 800 688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="core-split-title core-split-desc">
      <title id="core-split-title">How cores are split between the game and the background</title>
      <desc id="core-split-desc">Flowchart of how the rule splits one processor group's cores between the game and the background, based on hybrid P and E cores, cache blocks, and physical core count.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- arrows (drawn first, behind nodes) -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)">
        <path d="M240,64 V84"/>
        <path d="M400,156 H448"/>
        <path d="M240,228 V260"/>
        <path d="M400,332 H552 Q560,332 560,340 V356"/>
        <path d="M240,404 V536"/>
        <path d="M560,500 V536"/>
        <path d="M400,428 H328 Q320,428 320,436 V536"/>
      </g>

      <!-- start -->
      <rect x="40" y="24" width="400" height="40" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="240" y="49" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">One processor group (up to 64 threads)</text>

      <!-- decision 1: hybrid? -->
      <polygon points="240,84 400,156 240,228 80,156" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="240" y="152" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Different efficiency</text>
      <text x="240" y="170" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">classes between cores?</text>

      <!-- result: hybrid -->
      <rect x="448" y="92" width="328" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="464" y="116" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">Hybrid: P-cores and E-cores</text>
      <text x="464" y="140" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif">Game: highest-class cores, except</text>
      <text x="464" y="158" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif">the first if 4+ P-cores.</text>
      <text x="464" y="180" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">Background: the E-cores.</text>
      <text x="464" y="198" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">Low-power E-cores: left to Windows</text>

      <!-- decision 2: several cache blocks and 6+ physical cores? -->
      <polygon points="240,260 400,332 240,404 80,332" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="240" y="328" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Several cache blocks</text>
      <text x="240" y="346" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">and 6+ physical cores?</text>

      <!-- decision 3: small secondary block without the first core? -->
      <polygon points="560,356 720,428 560,500 400,428" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="560" y="412" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Small secondary block</text>
      <text x="560" y="430" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">(a third of threads or less)</text>
      <text x="560" y="448" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">without the first core?</text>

      <!-- result: last physical core (monolithic or symmetric) -->
      <rect x="24" y="536" width="328" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="40" y="560" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">Last physical core</text>
      <text x="40" y="582" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">Background: the last physical core</text>
      <text x="40" y="600" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">(its threads if 4+ cores; else 1).</text>
      <text x="40" y="622" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif">Game: the rest, without the first</text>
      <text x="40" y="640" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif">core if 4+ physical cores.</text>

      <!-- result: compact island -->
      <rect x="400" y="536" width="320" height="128" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="416" y="560" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">Compact island</text>
      <text x="416" y="582" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif">Background: the whole island.</text>
      <text x="416" y="604" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif">Game: the rest, without the first</text>
      <text x="416" y="622" fill="#bf4520" font-size="14" font-family="'Geist', system-ui, sans-serif">core if 4+ physical cores.</text>

      <!-- branch labels (opaque masks, 8px gap to the line) -->
      <rect x="408" y="130" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="424" y="142" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="500" text-anchor="middle">yes</text>
      <rect x="248" y="236" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="262" y="248" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="500" text-anchor="middle">no</text>
      <rect x="464" y="308" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="480" y="320" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="500" text-anchor="middle">yes</text>
      <rect x="248" y="456" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="262" y="468" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="500" text-anchor="middle">no</text>
      <rect x="568" y="510" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="584" y="522" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="500" text-anchor="middle">yes</text>
      <rect x="328" y="470" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="342" y="482" fill="#4f5d75" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="500" text-anchor="middle">no</text>
    </svg>
    </div>
  </div>
</body>
</html>
