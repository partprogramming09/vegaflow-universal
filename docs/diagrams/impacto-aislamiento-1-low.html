<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impacto del aislamiento en el 1% Low</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Patrón universal · VegaFlow Universal</p>
    <h1>Impacto porcentual del aislamiento en percentiles 1% Low (con carga de fondo)</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="impacto-aislamiento-1-low-title impacto-aislamiento-1-low-desc">
      <title id="impacto-aislamiento-1-low-title">Impacto del aislamiento en el 1% Low</title>
      <desc id="impacto-aislamiento-1-low-desc">Incremento porcentual del 1% Low con carga de fondo al aislar: APU integrada (UMA) 136.8, gráfica externa (eGPU TB4) 65.0 y gráfica dedicada (dGPU PCIe) 42.0, en una escala de 0 a 160.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="280" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CON CARGA DE FONDO</text>

      <!-- Escala: x = 280 + valor × 4 (0 → 280, 160 → 920) -->
      <!-- Líneas de guía verticales -->
      <line x1="440" y1="48" x2="440" y2="264" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="600" y1="48" x2="600" y2="264" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="760" y1="48" x2="760" y2="264" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="920" y1="48" x2="920" y2="264" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <!-- Ejes -->
      <line x1="280" y1="48" x2="280" y2="264" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="280" y1="264" x2="920" y2="264" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Barra 1 · APU integrada (focal) · 136.8 → ancho 547.2 -->
      <rect x="280" y="68" width="547.2" height="40" fill="#f5f5f5"/>
      <rect x="280" y="68" width="547.2" height="40" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
      <text x="268" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">APU Integrada (UMA)</text>
      <text x="836" y="92" fill="#bf4520" font-size="11" font-weight="600" font-family="'Geist Mono', monospace">136.8</text>

      <!-- Barra 2 · eGPU · 65.0 → ancho 260 -->
      <rect x="280" y="136" width="260" height="40" fill="#f5f5f5"/>
      <rect x="280" y="136" width="260" height="40" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="268" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Gráfica Externa (eGPU TB4)</text>
      <text x="548" y="160" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">65.0</text>

      <!-- Barra 3 · dGPU · 42.0 → ancho 168 -->
      <rect x="280" y="204" width="168" height="40" fill="#f5f5f5"/>
      <rect x="280" y="204" width="168" height="40" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="268" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Gráfica Dedicada (dGPU PCIe)</text>
      <text x="456" y="228" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">42.0</text>

      <!-- Marcas del eje -->
      <text x="280" y="284" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
      <text x="440" y="284" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">40</text>
      <text x="600" y="284" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">80</text>
      <text x="760" y="284" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">120</text>
      <text x="920" y="284" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">160</text>
      <text x="600" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">Incremento % en 1% Low (Fluidez), escala 0 a 160</text>
    </svg>
    </div>
  </div>
</body>
</html>
