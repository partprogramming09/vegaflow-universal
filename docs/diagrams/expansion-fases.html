<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expansión por fases</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 700px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; max-width: 700px; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo · VegaFlow Universal</p>
    <h1>Expansión por fases: E1 a E4</h1>
    <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expansion-fases-title expansion-fases-desc">
      <title id="expansion-fases-title">Expansión por fases de VegaFlow: E1 a E4</title>
      <desc id="expansion-fases-desc">Cuatro fases en fila: E1, Multi-GPU y seguridad base, con seis subfases y marcada para ejecutar ahora; después E2, Recursos y eventos; E3, eGPU y HAL multi-fabricante; y E4, IPC sin privilegios y tiendas, las tres solo planificadas.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- flechas (antes que las cajas). Las dos últimas, discontinuas: planificadas -->
      <line x1="184" y1="210" x2="214" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="384" y1="210" x2="414" y2="210" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="584" y1="210" x2="614" y2="210" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- E1: ejecutar ahora (acento) -->
      <rect x="16" y="60" width="168" height="300" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="60" width="168" height="300" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
      <rect x="28" y="76" width="144" height="24" rx="4" fill="none" stroke="#bf4520" stroke-width="1"/>
      <text x="100" y="93" fill="#bf4520" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ejecutar ahora</text>
      <text x="28" y="128" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">E1</text>
      <text x="28" y="152" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">Multi-GPU y</text>
      <text x="28" y="172" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">seguridad base</text>
      <text x="28" y="192" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">(0.2.x)</text>
      <line x1="28" y1="208" x2="172" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="28" y="230" fill="#2d3142" font-size="14" font-family="'Geist Mono', monospace">E1.5 · Rust</text>
      <text x="28" y="252" fill="#2d3142" font-size="14" font-family="'Geist Mono', monospace">E1.3</text>
      <text x="28" y="274" fill="#2d3142" font-size="14" font-family="'Geist Mono', monospace">E1.4</text>
      <text x="28" y="296" fill="#2d3142" font-size="14" font-family="'Geist Mono', monospace">E1.1</text>
      <text x="28" y="318" fill="#2d3142" font-size="14" font-family="'Geist Mono', monospace">E1.2</text>
      <text x="28" y="340" fill="#2d3142" font-size="14" font-family="'Geist Mono', monospace">E1.6</text>

      <!-- E2: solo planificada -->
      <rect x="216" y="60" width="168" height="300" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="60" width="168" height="300" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="228" y="76" width="144" height="24" rx="4" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="300" y="93" fill="#4f5d75" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Solo planificada</text>
      <text x="228" y="128" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">E2</text>
      <text x="228" y="152" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">Recursos y</text>
      <text x="228" y="172" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">eventos</text>

      <!-- E3: solo planificada -->
      <rect x="416" y="60" width="168" height="300" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="60" width="168" height="300" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="428" y="76" width="144" height="24" rx="4" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="93" fill="#4f5d75" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Solo planificada</text>
      <text x="428" y="128" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">E3</text>
      <text x="428" y="152" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">eGPU y HAL</text>
      <text x="428" y="172" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">multi-fabricante</text>

      <!-- E4: solo planificada -->
      <rect x="616" y="60" width="168" height="300" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="60" width="168" height="300" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="628" y="76" width="144" height="24" rx="4" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <text x="700" y="93" fill="#4f5d75" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Solo planificada</text>
      <text x="628" y="128" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">E4</text>
      <text x="628" y="152" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">IPC sin</text>
      <text x="628" y="172" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">privilegios y</text>
      <text x="628" y="192" fill="#2d3142" font-size="14" font-weight="500" font-family="'Geist', sans-serif">tiendas</text>

      <text x="16" y="388" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif">Trazo sólido: se ejecuta ahora. Discontinuo: solo planificada.</text>
    </svg>
  </div>
</body>
</html>
