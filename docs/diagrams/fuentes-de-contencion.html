<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuentes universales de contención</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Patrón universal · VegaFlow Universal</p>
    <h1>Las 4 fuentes universales de contención en el subsistema de cómputo</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fuentes-de-contencion-title fuentes-de-contencion-desc">
      <title id="fuentes-de-contencion-title">Las 4 fuentes universales de contención</title>
      <desc id="fuentes-de-contencion-desc">Cuatro fuentes de contención comunes a cualquier CPU y gráfica: jerarquía de memoria y vaciado de TLB, latencia de despacho D3D/Vulkan, contención de cola de E/S y fallos de página, y presupuesto energético y térmico compartido.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="120" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LAS 4 FUENTES UNIVERSALES DE CONTENCIÓN EN EL SUBSISTEMA DE CÓMPUTO</text>

      <!-- Bordes del bloque -->
      <line x1="120" y1="72" x2="880" y2="72" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="488" x2="880" y2="488" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- 1 · Jerarquía de memoria -->
      <rect x="120" y="72" width="760" height="104" fill="#ffffff"/>
      <line x1="120" y1="176" x2="880" y2="176" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="106" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
      <text x="260" y="108" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Jerarquía de Memoria y TLB Flush</text>
      <text x="260" y="134" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Latencia L3: ~10-14 ns | Latencia RAM DDR4/DDR5: ~70-95 ns (7x más lenta)</text>
      <text x="260" y="154" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Desalojo forzado de líneas de caché de hilos gráficos y colisiones en TLB</text>

      <!-- 2 · Despacho D3D/Vulkan -->
      <rect x="120" y="176" width="760" height="104" fill="#f5f5f5"/>
      <line x1="120" y1="280" x2="880" y2="280" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
      <text x="260" y="212" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Latencia de Despacho D3D/Vulkan (Quantum Preemption)</text>
      <text x="260" y="238" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Ninguna GPU dibuja de forma autónoma: la CPU debe despachar Command Lists</text>
      <text x="260" y="258" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Interrupciones ISR/DPC provocan burbujas de inanición (GPU Starvation)</text>

      <!-- 3 · Cola de E/S -->
      <rect x="120" y="280" width="760" height="104" fill="#ffffff"/>
      <line x1="120" y1="384" x2="880" y2="384" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
      <text x="260" y="316" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Contención de Cola I/O y Fallos de Página (Async Streaming)</text>
      <text x="260" y="342" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Bloqueo en colas NVMe y contención en gestor de memoria virtual</text>
      <text x="260" y="362" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Afecta a motores modernos con DirectStorage / UE4 / UE5</text>

      <!-- 4 · Energía y temperatura -->
      <rect x="120" y="384" width="760" height="104" fill="#f5f5f5"/>
      <text x="140" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04</text>
      <text x="260" y="420" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Presupuesto Energético y Térmico Compartido</text>
      <text x="260" y="446" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• AMD: <tspan font-family="'Geist Mono', monospace" font-size="10">STAPM / PPT / TDC / EDC</tspan>  |  Intel: <tspan font-family="'Geist Mono', monospace" font-size="10">PL1 / PL2 / Tau / TVB</tspan></text>
      <text x="260" y="466" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">• Carga parásita en núcleos secundarios roba watts y deprime frecuencias Turbo</text>
    </svg>
    </div>
  </div>
</body>
</html>
