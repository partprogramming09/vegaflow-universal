<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura aislada</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Después · Aislada</p>
    <h1>Aislada: las 4 barreras de contención del kernel de Windows NT</h1>
    <div class="scroll">
    <svg viewBox="0 0 1000 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aislada-4-barreras-title aislada-4-barreras-desc">
      <title id="aislada-4-barreras-title">Aislada: las 4 barreras de contención del kernel de Windows NT</title>
      <desc id="aislada-4-barreras-desc">Los procesos de fondo ruidosos quedan en una jaula en el último núcleo físico con tres barreras; el ahorro térmico vuelve al juego, sus hilos críticos despachan draw calls sin interrupción y la cuarta barrera fija FlipQueueSize = 1 y ASPM = 0 en el registro.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
      <line x1="500" y1="280" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="508" y="296" width="272" height="16" fill="#f5f5f5"/>
      <text x="514" y="308" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Ahorro térmico de 3W a 5W devuelto al juego</text>
      <line x1="500" y1="408" x2="500" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="508" y="424" width="236" height="16" fill="#f5f5f5"/>
      <text x="514" y="436" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Despacho ininterrumpido de Draw Calls</text>
      <rect x="120" y="80" width="760" height="200" fill="rgba(191,69,32,0.08)"/>
      <rect x="120" y="80" width="760" height="200" fill="none" stroke="#bf4520" stroke-width="1"/>
      <text x="140" y="112" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" letter-spacing="0.14em">FONDO</text>
      <text x="220" y="114" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" font-weight="600">Jaula de sacrificio determinista</text>
      <text x="860" y="114" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Último núcleo físico - Núcleo 5 / Afinidad 0xC00</text>
      <text x="220" y="142" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Procesos de fondo ruidosos (Chrome, Discord, Launchers)</text>
      <text x="220" y="172" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">1. SetProcessDefaultCpuSets / Afinidad 0xC00</text>
      <text x="220" y="196" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">2. EcoQoS: SetProcessInformation (ProcessPowerThrottling)</text>
      <text x="220" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">3. I/O NT: NtSetInformationProcess (IoPriorityVeryLow = 0)</text>
      <text x="240" y="238" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Memory Priority: MEMORY_PRIORITY_LOW (2)</text>
      <rect x="120" y="328" width="760" height="80" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">JUEGO</text>
      <text x="220" y="362" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" font-weight="600">Espacio de cómputo prioritario</text>
      <text x="860" y="362" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Núcleos 0 a 4</text>
      <text x="220" y="382" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Hilos críticos del motor de juego: GameThread / RenderThread / Audio / RHI</text>
      <text x="220" y="398" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Libre de desalojos de caché L3 · Frecuencia Turbo sostenida a máxima cota (+138 a +290 MHz)</text>
      <rect x="120" y="456" width="760" height="88" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">REGISTRO</text>
      <text x="220" y="490" fill="#2d3142" font-size="16" font-family="'Geist', sans-serif" font-weight="600">Barrera D3D/Driver en registro NT</text>
      <text x="860" y="490" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">4. FlipQueueSize = 1 + PCIe ASPM = 0</text>
      <text x="220" y="512" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cero cuadros encolados en cola de presentación</text>
      <text x="220" y="528" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Cero transiciones L0s/L1 de micro-reposo en bus PCIe</text>
      <text x="120" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FOCO</text>
      <text x="216" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Las barreras 1 a 3 actúan sobre los procesos de fondo de la jaula; la barrera 4 se fija en el registro del adaptador de pantalla.</text>
    </svg>
    </div>
  </div>
</body>
</html>
