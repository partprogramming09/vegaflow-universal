# Continuous integration on GitHub-hosted runners only.
#
# What runs here: the Rust core tests, the C++ unit tests that need no Windows (host build, including the FFI layout
# check of Test 34) and a cross-compile of the Windows daemon and test suite. The Rust version is pinned in
# rust-toolchain.toml. The C++ integration tests change the registry and the power plan of a real Windows machine
# and need a GPU, so they are run by hand on the test laptop (scripts/remote/vfdev cross-test), never on a self-hosted runner: a public repository lets
# any fork run code on such a runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layers:
    name: Layer rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check includes against the layer table
        run: scripts/ci/check_layers.sh

  rust-core:
    name: Rust core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run the tests
        run: cargo test --manifest-path rust/vegaflow-core/Cargo.toml --locked

  host-unit-tests:
    name: C++ host unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and run (fails if any test fails)
        run: scripts/ci/host-unit-tests.sh

  windows-cross-build:
    name: Cross-compile for Windows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw-w64 (POSIX threads); the Rust target comes from rust-toolchain.toml
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
      - name: Build the daemon and the test suite
        run: scripts/build/build-cross.sh
        env:
          VF_CXX: x86_64-w64-mingw32-g++-posix

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4  # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the VitePress site (fails on dead links)
        run: pnpm docs:build
